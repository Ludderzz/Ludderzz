name: Update Profile Date

on:
  schedule:
    - cron: '0 0 * * *' # Runs automatically every day at midnight UTC
  workflow_dispatch: # Allows you to trigger it manually anytime

jobs:
  update_readme:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update date in README
        run: |
          CURRENT_DATE=$(date -u +"%Y-%m-%d")
          sed -i "s/<!-- last-update-date -->.*/<!-- last-update-date --> **$CURRENT_DATE**/" README.md

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update profile last-checked date"
